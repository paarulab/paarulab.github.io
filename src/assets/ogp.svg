<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <radialGradient id="bg" cx="85%" cy="15%" r="90%"><stop stop-color="#e2d3f5"/><stop offset="1" stop-color="#f4effb"/></radialGradient>
    <radialGradient id="moonlight" cx="50%" cy="50%" r="70%">
      <stop stop-color="#fff8e5"/>
      <stop offset="0.55" stop-color="#fff7e0"/>
      <stop offset="1" stop-color="#fdf4dc"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0.5" stop-color="#fff6da" stop-opacity="0.4"/>
      <stop offset="0.73" stop-color="#fff6da" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff6da" stop-opacity="0"/>
    </radialGradient>
    <filter id="star-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect x="32" y="32" width="1136" height="536" rx="28" fill="none" stroke="#dfd2ee" stroke-width="2"/>
  <circle cx="930" cy="255" r="205" fill="url(#halo)"/>
  <circle cx="930" cy="255" r="130" fill="url(#moonlight)" stroke="#fffbed" stroke-opacity="0.3" stroke-width="1"/>
  <g fill="#fff7df" filter="url(#star-glow)"><circle cx="1060" cy="370" r="6"/><circle cx="815" cy="125" r="4"/><circle cx="800" cy="400" r="5"/></g>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="100" y="180" font-size="20" letter-spacing="5" fill="#8060a7">PERSONAL WEBSITE</text>
    <text x="92" y="315" font-size="120" font-weight="bold" fill="#403452">paaru</text>
    <text x="100" y="385" font-size="25" letter-spacing="3" fill="#776886">WORKS / ARTICLES / ABOUT</text>
  </g>
</svg>
